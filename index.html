<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>نظام إدارة الفرص</title>

<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<meta name="apple-mobile-web-app-title" content="إدارة الفرص" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="icon" href="./icons/icon-192.png" />

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { font-family: 'Tajawal', sans-serif; background:#F6F4EF; color:#1C2433; min-height:100vh;
    -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
  #root { min-height:100vh; }

  .op-loading { display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; gap:12px; }
  .op-spinner { width:28px; height:28px; border:3px solid #d9d4c8; border-top-color:#C9822C; border-radius:50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .op-shell { display:flex; min-height:100vh; flex-direction:column; padding-bottom: 64px; }

  .op-topbar { position:sticky; top:0; z-index:20; background:#0F1B2D; color:#fff; padding: 14px 16px calc(14px + env(safe-area-inset-top)) 16px; display:flex; align-items:center; gap:10px; }
  .op-brand-mark { width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#C9822C,#a8661d); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; flex-shrink:0; }
  .op-topbar-title { font-weight:700; font-size:15px; }
  .op-topbar-sub { font-size:10.5px; color:#9aa6bc; margin-top:1px; }
  .op-logout-btn { background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.15); border-radius:8px; padding:7px 12px; font-family:inherit; font-size:11.5px; flex-shrink:0; }

  .op-login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(180deg,#0F1B2D,#1c2b45); }
  .op-login-card { background:#fff; border-radius:18px; padding:28px 22px; width:100%; max-width:360px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .op-login-card h1 { font-size:18px; margin:0 0 4px; color:#0F1B2D; }
  .op-login-card p { font-size:12px; color:#6b7285; margin:0 0 18px; }
  .op-login-card .op-field { text-align:right; }
  .op-login-err { background:#FBEBE9; color:#B23A2E; font-size:12px; padding:8px 10px; border-radius:8px; margin-bottom:12px; }

  .op-main { flex:1; padding: 14px 14px 90px; max-width:640px; margin:0 auto; width:100%; }
  .op-view { display:flex; flex-direction:column; gap:14px; }
  .op-view-header h1 { font-size:19px; font-weight:900; margin:0 0 3px; color:#0F1B2D; }
  .op-view-header p { font-size:12px; color:#6b7285; margin:0; }
  .op-header-actions { display:flex; gap:8px; margin-top:8px; }

  .op-card { background:#fff; border:1px solid #E7E2D6; border-radius:14px; padding:16px; }
  .op-card-title { font-weight:700; font-size:13.5px; margin-bottom:10px; color:#2b3245; }
  .op-section-title { font-weight:900; font-size:14px; margin-bottom:12px; color:#0F1B2D; border-bottom:2px solid #F1EEE4; padding-bottom:8px; }

  .op-funnel-card { background: linear-gradient(180deg,#0F1B2D,#152238); border:none; color:#fff; }
  .op-funnel-title { font-weight:700; font-size:12px; color:#9aa6bc; margin-bottom:14px; }
  .op-funnel { display:flex; flex-direction:column; gap:10px; }
  .op-funnel-seg { width:100%; }
  .op-funnel-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .op-funnel-bar-track { background:#1c2b45; border-radius:6px; overflow:hidden; height:8px; }
  .op-funnel-bar { height:100%; border-radius:6px; }
  .op-funnel-num { font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; }
  .op-funnel-label { font-size:11px; color:#9aa6bc; }

  .op-kpi-row { display:grid; grid-template-columns: repeat(2,1fr); gap:10px; }
  .op-kpi { display:flex; align-items:center; gap:10px; padding:13px 14px; }
  .op-kpi-icon { width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .op-kpi-value { font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; color:#0F1B2D; }
  .op-kpi-label { font-size:10.5px; color:#6b7285; margin-top:1px; }

  .op-donut-wrap { display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center; }
  .op-donut { position:relative; width:150px; height:150px; border-radius:50%; flex-shrink:0; }
  .op-donut-hole { position:absolute; inset:22px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  .op-donut-hole b { font-size:20px; color:#0F1B2D; font-family:'IBM Plex Mono',monospace; }
  .op-donut-hole span { font-size:10px; color:#8a8f9e; }
  .op-legend { display:flex; flex-direction:column; gap:8px; }
  .op-legend-row { display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .op-legend-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }

  .op-hbar-row { margin-bottom:10px; }
  .op-hbar-top { display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; }
  .op-hbar-track { background:#F1EEE4; border-radius:20px; height:10px; overflow:hidden; }
  .op-hbar-fill { height:100%; border-radius:20px; }

  .op-empty { color:#9a9dac; font-size:12.5px; text-align:center; padding:30px 0; }

  .op-due-list { display:flex; flex-direction:column; gap:6px; }
  .op-due-row { display:flex; align-items:center; justify-content:space-between; padding:9px 10px; border-radius:9px; background:#FAF8F2; }
  .op-due-name { font-weight:700; font-size:12.5px; }
  .op-due-meta { font-size:10.5px; color:#8a8f9e; margin-top:1px; }
  .op-due-badge { font-size:10.5px; font-weight:700; padding:4px 8px; border-radius:20px; background:#EAF4EE; color:#2F7A56; white-space:nowrap; }
  .op-due-badge.late { background:#FBEBE9; color:#B23A2E; }

  .op-seller-card { border:1px solid #F1EEE4; border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .op-seller-top { display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:6px; }
  .op-rate-bar-wrap { position:relative; background:#F1EEE4; border-radius:20px; height:18px; overflow:hidden; }
  .op-rate-bar { position:absolute; inset:0; background:#C9822C; opacity:.35; border-radius:20px; }
  .op-rate-bar-wrap span { position:relative; font-size:10.5px; font-weight:700; padding-right:8px; line-height:18px; z-index:1; }

  .op-field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .op-field-label { font-size:12px; font-weight:700; color:#3d4457; }
  .op-req { color:#B23A2E; margin-right:3px; }
  .op-input, .op-select { width:100%; border:1.5px solid #E7E2D6; border-radius:9px; padding:10px 12px; font-family:inherit; font-size:14px; background:#FDFCF9; appearance:none; }
  .op-input:focus, .op-select:focus { outline:none; border-color:#C9822C; }
  .op-select-wrap { position:relative; }
  .op-select { padding-left:30px; }
  .op-select-chevron { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#9a9dac; pointer-events:none; }

  .op-status-tabs { display:flex; gap:7px; }
  .op-status-tab { flex:1; padding:11px 4px; border-radius:10px; border:1.5px solid #E7E2D6; background:#fff; font-family:inherit; font-weight:700; font-size:12.5px; color:#556; }

  .op-fu-block { border:1.5px dashed #E7E2D6; border-radius:10px; padding:11px; margin-bottom:12px; }
  .op-fu-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .op-fu-date { font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:#C9822C; }
  .op-fu-bottom { display:flex; gap:8px; align-items:center; }
  .op-check { display:flex; align-items:center; gap:5px; font-size:11.5px; white-space:nowrap; background:#F6F4EF; padding:9px 10px; border-radius:9px; }

  .op-form-actions { display:flex; gap:10px; }
  .op-btn-primary { display:flex; align-items:center; justify-content:center; gap:7px; background:#0F1B2D; color:#fff; border:none; padding:12px 16px; border-radius:10px; font-family:inherit; font-weight:700; font-size:13.5px; flex:1; }
  .op-btn-primary:disabled { opacity:.4; }
  .op-btn-secondary { display:flex; align-items:center; justify-content:center; gap:7px; background:#fff; color:#3d4457; border:1.5px solid #E7E2D6; padding:11px 16px; border-radius:10px; font-family:inherit; font-weight:700; font-size:13.5px; flex:1; }
  .op-btn-icon { width:40px; height:40px; flex-shrink:0; border-radius:9px; border:none; background:#0F1B2D; color:#fff; display:flex; align-items:center; justify-content:center; }

  .op-search { display:flex; align-items:center; gap:8px; border:1.5px solid #E7E2D6; border-radius:9px; padding:9px 12px; background:#FDFCF9; margin-bottom:10px; }
  .op-search input { border:none; outline:none; background:transparent; font-family:inherit; font-size:13.5px; width:100%; }
  .op-filters-row { display:flex; gap:8px; margin-bottom:10px; }
  .op-filters-row > * { flex:1; }

  .op-customer-card { border:1px solid #F1EEE4; border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .op-cc-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .op-cc-name { font-weight:700; font-size:14px; }
  .op-cc-meta { font-size:11.5px; color:#8a8f9e; margin-top:2px; }
  .op-badge { font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap; }
  .op-cc-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:12px; color:#556; }
  .op-cc-actions { display:flex; gap:6px; }
  .op-cc-actions button { width:30px; height:30px; border-radius:8px; border:1px solid #E7E2D6; background:#fff; display:flex; align-items:center; justify-content:center; }
  .op-cc-actions .op-danger { background:#FBEBE9; color:#B23A2E; border-color:#f3d9d6; }

  .op-list-add { display:flex; gap:8px; margin-bottom:10px; }
  .op-chip-list { display:flex; flex-wrap:wrap; gap:6px; }
  .op-chip { display:flex; align-items:center; gap:6px; background:#F6F4EF; border:1px solid #E7E2D6; border-radius:20px; padding:6px 6px 6px 12px; font-size:12px; }
  .op-chip button { width:18px; height:18px; border-radius:50%; border:none; background:#E7E2D6; display:flex; align-items:center; justify-content:center; }

  .op-tabbar { position:fixed; bottom:0; left:0; right:0; background:#0F1B2D; display:flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:30; }
  .op-tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px; background:transparent; border:none; color:#8590a6; font-family:inherit; font-size:10px; }
  .op-tab-btn.active { color:#C9822C; }

  .op-toast { position:fixed; bottom:76px; left:50%; transform:translateX(-50%); background:#0F1B2D; color:#fff; padding:10px 20px; border-radius:30px; font-size:12.5px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:50; }
  .op-toast.error { background:#B23A2E; }

  .op-install-banner { position:fixed; bottom:64px; left:10px; right:10px; background:#fff; border:1px solid #E7E2D6; border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px; box-shadow:0 10px 30px rgba(0,0,0,.15); z-index:40; }
  .op-install-banner button { background:#C9822C; color:#1C1305; border:none; padding:8px 14px; border-radius:9px; font-weight:700; font-size:12px; font-family:inherit; white-space:nowrap; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ---------------- helpers ---------------- */
const todayStr = () => new Date().toISOString().slice(0, 10);
const addDays = (dateStr, days) => {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
};
const fmtDate = (d) => {
  if (!d) return "—";
  return new Date(d + "T00:00:00").toLocaleDateString("ar-EG", { day: "2-digit", month: "2-digit", year: "numeric" });
};
const daysUntil = (d) => {
  if (!d) return null;
  const target = new Date(d + "T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((target - now) / 86400000);
};
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

const STATUS_META = {
  closed: { label: "تم البيع", color: "#2F7A56", bg: "#EAF4EE" },
  open: { label: "مفتوح / محتمل", color: "#C9822C", bg: "#FBF1E4" },
  lost: { label: "فاقد", color: "#B23A2E", bg: "#FBEBE9" },
};
const FALLBACK_STATUS = { label: "غير محدد", color: "#8590a6", bg: "#F1EEE4" };
const getStatusMeta = (status) => STATUS_META[status] || FALLBACK_STATUS;

const DEFAULT_CONFIG = {
  branches: ["أسوان","الأقصر","نجع حمادي","سوهاج","أسيوط","المنيا","الفيوم","الدهار"],
  sellers: ["بائع 1"],
  openReasons: ["السعر مرتفع","يريد المقارنة مع أماكن أخرى","الموديل/اللون غير متوفر","يحتاج استشارة الأسرة","يفكر في التقسيط"],
  lostReasons: ["اشترى من مكان آخر","غير مهتم فعليًا","السعر خارج الميزانية","لم يتم الرد عند المتابعة","المنتج غير متوفر لدينا"],
  commMethods: ["رسالة واتساب","مكالمة تليفونية","رسالة SMS"],
};

const emptyCustomer = () => ({
  id: uid(), name: "", phone: "", visitDate: todayStr(), branch: "", seller: "",
  product: "", productValue: "", status: "open",
  openReason: "", lostReason: "", receiptDate: "",
  f1Date: "", f1Method: "", f1Done: false,
  f2Date: "", f2Method: "", f2Done: false,
  f3Date: "", f3Method: "", f3Done: false,
  createdAt: new Date().toISOString(),
});

function withFollowUps(c) {
  const next = { ...c };
  if (c.status === "closed") {
    const base = c.receiptDate || c.visitDate;
    next.f1Date = addDays(base, 2); next.f2Date = addDays(base, 7); next.f3Date = addDays(base, 30);
  } else {
    next.f1Date = addDays(c.visitDate, 2); next.f2Date = addDays(c.visitDate, 10);
    if (c.status === "lost") next.f3Date = "";
  }
  return next;
}

/* ---------------- storage (localStorage) ---------------- */
const SESSION_KEY = "op_session_v1";
function loadSession() {
  try { const v = localStorage.getItem(SESSION_KEY); return v ? JSON.parse(v) : null; }
  catch (e) { return null; }
}
function saveSession(s) {
  try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); }
  catch (e) {}
}

/* ---------------- API layer (Google Apps Script backend) ---------------- */
const API_URL = (window.OP_CONFIG && window.OP_CONFIG.API_URL) || "";

async function apiLogin(name, password) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "login", name, password }),
  });
  return res.json();
}

async function apiGetAll(session, asSeller) {
  const params = new URLSearchParams({ action: "getAll", user: session.name, pass: session.password });
  if (asSeller) params.set("asSeller", asSeller);
  const res = await fetch(`${API_URL}?${params.toString()}`);
  return res.json();
}

async function apiPost(session, action, payload) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, user: session.name, pass: session.password, payload }),
  });
  return res.json();
}

/* ---------------- icons ---------------- */
function Icon({ name, size = 17, color = "currentColor" }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  const map = {
    dashboard: <svg {...common}><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>,
    userPlus: <svg {...common}><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>,
    users: <svg {...common}><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"/><path d="M17 3.13a4 4 0 010 7.75"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>,
    settings: <svg {...common}><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" strokeDasharray="2 3"/></svg>,
    download: <svg {...common}><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
    edit: <svg {...common}><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg>,
    trash: <svg {...common}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>,
    search: <svg {...common}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
    x: <svg {...common}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
    check: <svg {...common}><polyline points="20 6 9 17 4 12"/></svg>,
    plus: <svg {...common}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
    chevronDown: <svg {...common}><polyline points="6 9 12 15 18 9"/></svg>,
    alert: <svg {...common}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
    trendUp: <svg {...common}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
    save: <svg {...common}><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
    coins: <svg {...common}><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1110.34 18"/><path d="M7 6h1v4"/></svg>,
  };
  return map[name] || null;
}

/* ---------------- small atoms ---------------- */
const Card = ({ children, className = "" }) => <div className={`op-card ${className}`}>{children}</div>;
const Select = ({ value, onChange, options, placeholder, allowEmpty = true }) => (
  <div className="op-select-wrap">
    <select className="op-select" value={value} onChange={(e) => onChange(e.target.value)}>
      {allowEmpty && <option value="">{placeholder || "اختر..."}</option>}
      {options.map((o) => <option key={o} value={o}>{o}</option>)}
    </select>
    <span className="op-select-chevron"><Icon name="chevronDown" size={15} /></span>
  </div>
);
const Field = ({ label, children, required }) => (
  <label className="op-field">
    <span className="op-field-label">{label}{required && <span className="op-req">*</span>}</span>
    {children}
  </label>
);
const ViewHeader = ({ title, subtitle, action }) => (
  <div className="op-view-header">
    <h1>{title}</h1><p>{subtitle}</p>
    {action}
  </div>
);
const EmptyHint = ({ text }) => <div className="op-empty">{text}</div>;

/* ---------------- Donut chart (conic-gradient) ---------------- */
function Donut({ data, total }) {
  let cumulative = 0;
  const stops = data.map((d) => {
    const pct = total ? (d.value / total) * 100 : 0;
    const start = cumulative; cumulative += pct;
    return `${d.color} ${start}% ${cumulative}%`;
  });
  const bg = total ? `conic-gradient(${stops.join(",")})` : "#F1EEE4";
  return (
    <div className="op-donut-wrap">
      <div className="op-donut" style={{ background: bg }}>
        <div className="op-donut-hole"><b>{total}</b><span>إجمالي</span></div>
      </div>
      <div className="op-legend">
        {data.map((d) => (
          <div className="op-legend-row" key={d.name}>
            <span className="op-legend-dot" style={{ background: d.color }} />
            <span>{d.name}: <b>{d.value}</b> ({total ? Math.round((d.value/total)*100) : 0}%)</span>
          </div>
        ))}
      </div>
    </div>
  );
}
function HBarList({ data, color }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div>
      {data.map((d) => (
        <div className="op-hbar-row" key={d.name}>
          <div className="op-hbar-top"><span>{d.name}</span><b>{d.value}</b></div>
          <div className="op-hbar-track"><div className="op-hbar-fill" style={{ width: `${(d.value/max)*100}%`, background: color }} /></div>
        </div>
      ))}
    </div>
  );
}

/* ================= LOGIN ================= */
function LoginScreen({ onLogin }) {
  const [name, setName] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const submit = async () => {
    if (!name.trim() || !password.trim()) return;
    setBusy(true); setErr("");
    try {
      const res = await apiLogin(name.trim(), password.trim());
      if (res.ok) onLogin({ name: res.name, role: res.role, password: password.trim() });
      else setErr("الاسم أو كلمة المرور غير صحيحة");
    } catch (e) {
      setErr("تعذر الاتصال بالخادم — تأكد من الإنترنت وإعداد رابط API");
    }
    setBusy(false);
  };

  return (
    <div className="op-login-wrap">
      <div className="op-login-card">
        <div className="op-brand-mark" style={{width:44,height:44,fontSize:19,margin:"0 auto 14px"}}>ف</div>
        <h1>نظام إدارة الفرص</h1>
        <p>سجّل دخولك بالاسم وكلمة المرور اللي استلمتها من قائد المجموعة</p>
        <Field label="الاسم"><input className="op-input" value={name} onChange={(e)=>setName(e.target.value)} placeholder="اسمك بالظبط" /></Field>
        <Field label="كلمة المرور"><input type="password" className="op-input" value={password} onChange={(e)=>setPassword(e.target.value)} placeholder="••••••" onKeyDown={(e)=>{if(e.key==="Enter")submit();}} /></Field>
        {err && <div className="op-login-err">{err}</div>}
        <button className="op-btn-primary" style={{width:"100%"}} disabled={busy} onClick={submit}>{busy?"جارِ الدخول...":"دخول"}</button>
      </div>
    </div>
  );
}

/* ================= APP ================= */
function App() {
  const [session, setSession] = useState(loadSession());
  const [view, setView] = useState("dashboard");
  const [customers, setCustomers] = useState([]);
  const [config, setConfig] = useState(DEFAULT_CONFIG);
  const [editingId, setEditingId] = useState(null);
  const [toast, setToast] = useState(null);
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showInstall, setShowInstall] = useState(false);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState("");
  const [viewAsSeller, setViewAsSeller] = useState(null); // admin only
  const [meta, setMeta] = useState({ role: "seller", name: "" });

  useEffect(() => {
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); setDeferredPrompt(e); setShowInstall(true); });
  }, []);

  const loadData = useCallback(async (asSeller) => {
    if (!session) return;
    setLoading(true); setLoadError("");
    try {
      const res = await apiGetAll(session, asSeller);
      if (res.error) { setLoadError(res.error === "unauthorized" ? "انتهت صلاحية الدخول، سجّل مرة أخرى" : res.error); if (res.error==="unauthorized") logout(); }
      else { setCustomers(res.customers || []); setConfig(res.config || DEFAULT_CONFIG); setMeta({ role: res.role, name: res.name }); }
    } catch (e) { setLoadError("تعذر الاتصال بالخادم — تحقق من الإنترنت"); }
    setLoading(false);
  }, [session]);

  useEffect(() => { if (session) loadData(viewAsSeller); }, [session]);

  const showToast = (msg, type = "ok") => { setToast({ msg, type }); setTimeout(() => setToast(null), 2200); };

  const handleLogin = (s) => { setSession(s); saveSession(s); };
  const logout = () => { setSession(null); saveSession(null); setCustomers([]); setViewAsSeller(null); setView("dashboard"); };

  const saveCustomer = async (record) => {
    const withFU = withFollowUps(record);
    const res = await apiPost(session, "saveCustomer", withFU);
    if (res.error) { showToast(res.error === "forbidden" ? "غير مسموح بتعديل عميل بائع آخر" : "حدث خطأ أثناء الحفظ", "error"); return; }
    showToast("تم حفظ بيانات العميل");
    setEditingId(null); setView("list");
    loadData(viewAsSeller);
  };
  const deleteCustomer = async (id) => {
    const res = await apiPost(session, "deleteCustomer", { id });
    if (res.error) { showToast("غير مسموح بحذف هذا العميل", "error"); return; }
    showToast("تم حذف العميل");
    loadData(viewAsSeller);
  };
  const persistConfig = async (cfg) => {
    const res = await apiPost(session, "saveConfig", cfg);
    if (res.error) { showToast("غير مسموح — الإعدادات للقائد فقط", "error"); return; }
    showToast("تم حفظ الإعدادات");
    loadData(viewAsSeller);
  };

  const installApp = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt(); await deferredPrompt.userChoice;
    setDeferredPrompt(null); setShowInstall(false);
  };

  const selectViewAsSeller = (sellerName) => { setViewAsSeller(sellerName || null); loadData(sellerName || null); setView("dashboard"); };

  if (!session) return <LoginScreen onLogin={handleLogin} />;

  const isAdmin = meta.role === "admin";
  const tabs = [["dashboard","dashboard","الرئيسية"],["entry","userPlus","تسجيل"],["list","users","العملاء"]];
  if (isAdmin) tabs.push(["settings","settings","الإعدادات"]);

  return (
    <div className="op-shell">
      <div className="op-topbar">
        <div className="op-brand-mark">ف</div>
        <div style={{flex:1}}>
          <div className="op-topbar-title">نظام إدارة الفرص</div>
          <div className="op-topbar-sub">{isAdmin ? "قائد المجموعة" : "بائع"} · {meta.name}{viewAsSeller ? ` · عرض كـ ${viewAsSeller}` : ""}</div>
        </div>
        <button className="op-logout-btn" onClick={logout}>خروج</button>
      </div>

      {loading ? (
        <div className="op-loading"><div className="op-spinner" /><p>جارِ تحميل البيانات...</p></div>
      ) : loadError ? (
        <div className="op-main"><Card><div className="op-empty">{loadError}</div><button className="op-btn-primary" style={{marginTop:10}} onClick={()=>loadData(viewAsSeller)}>إعادة المحاولة</button></Card></div>
      ) : (
        <main className="op-main">
          {view === "dashboard" && (
            <Dashboard customers={customers} config={config} setView={setView} setEditingId={setEditingId}
              isAdmin={isAdmin} viewAsSeller={viewAsSeller} onSelectSeller={selectViewAsSeller} />
          )}
          {view === "entry" && (
            <EntryForm key={editingId || "new"} config={config} isEdit={!!editingId}
              initial={editingId ? customers.find((c) => c.id === editingId) : { ...emptyCustomer(), seller: isAdmin ? "" : meta.name }}
              lockSeller={!isAdmin} onSave={saveCustomer} onCancel={() => { setEditingId(null); setView("list"); }} />
          )}
          {view === "list" && (
            <CustomersList customers={customers} config={config}
              onEdit={(id) => { setEditingId(id); setView("entry"); }}
              onDelete={deleteCustomer} onNew={() => { setEditingId(null); setView("entry"); }} showToast={showToast} />
          )}
          {view === "settings" && isAdmin && <SettingsView config={config} onSave={persistConfig} showToast={showToast} />}
        </main>
      )}

      <nav className="op-tabbar">
        {tabs.map(([id,icon,label]) => (
          <button key={id} className={`op-tab-btn ${view===id?"active":""}`} onClick={() => { setEditingId(null); setView(id); }}>
            <Icon name={icon} size={19} /><span>{label}</span>
          </button>
        ))}
      </nav>

      {toast && <div className={`op-toast ${toast.type}`}>{toast.msg}</div>}
      {showInstall && (
        <div className="op-install-banner">
          <div style={{flex:1, fontSize:12.5}}>ثبّت التطبيق على شاشتك الرئيسية للوصول السريع</div>
          <button onClick={installApp}>تثبيت</button>
          <button onClick={() => setShowInstall(false)} style={{background:"#F1EEE4", color:"#556"}}>×</button>
        </div>
      )}
    </div>
  );
}

/* ---------------- Dashboard ---------------- */
function Dashboard({ customers, config, setView, setEditingId, isAdmin, viewAsSeller, onSelectSeller }) {
  const total = customers.length;
  const closed = customers.filter((c) => c.status === "closed").length;
  const open = customers.filter((c) => c.status === "open").length;
  const lost = customers.filter((c) => c.status === "lost").length;
  const conversion = total ? ((closed/total)*100).toFixed(1) : "0.0";
  const totalValue = customers.filter((c) => c.status === "closed").reduce((s,c) => s+(Number(c.productValue)||0), 0);

  const pieData = [
    { name: STATUS_META.closed.label, value: closed, color: STATUS_META.closed.color },
    { name: STATUS_META.open.label, value: open, color: STATUS_META.open.color },
    { name: STATUS_META.lost.label, value: lost, color: STATUS_META.lost.color },
  ];

  const lostReasonData = useMemo(() => {
    const counts = {};
    customers.filter((c) => c.status === "lost" && c.lostReason).forEach((c) => { counts[c.lostReason] = (counts[c.lostReason]||0)+1; });
    return Object.entries(counts).map(([name,value]) => ({name,value})).sort((a,b)=>b.value-a.value);
  }, [customers]);
  const openReasonData = useMemo(() => {
    const counts = {};
    customers.filter((c) => c.status === "open" && c.openReason).forEach((c) => { counts[c.openReason] = (counts[c.openReason]||0)+1; });
    return Object.entries(counts).map(([name,value]) => ({name,value})).sort((a,b)=>b.value-a.value);
  }, [customers]);

  const dueFollowUps = useMemo(() => {
    const rows = [];
    customers.forEach((c) => {
      const checks = c.status === "closed" ? [["f1Date","f1Done"],["f2Date","f2Done"],["f3Date","f3Done"]] : c.status === "open" ? [["f1Date","f1Done"],["f2Date","f2Done"]] : [];
      checks.forEach(([dk,dn]) => {
        const d = c[dk];
        if (d && !c[dn]) { const diff = daysUntil(d); if (diff !== null && diff <= 1) rows.push({ c, diff }); }
      });
    });
    return rows.sort((a,b)=>a.diff-b.diff).slice(0,6);
  }, [customers]);

  const sellerStats = useMemo(() => config.sellers.map((s) => {
    const rows = customers.filter((c) => c.seller === s);
    const cl = rows.filter((c) => c.status === "closed").length;
    return { seller: s, total: rows.length, closed: cl, rate: rows.length ? ((cl/rows.length)*100).toFixed(1) : "0.0" };
  }).filter((s) => s.total > 0), [customers, config.sellers]);

  return (
    <div className="op-view">
      <ViewHeader title="لوحة القيادة" subtitle={viewAsSeller ? `عرض بيانات البائع: ${viewAsSeller}` : "نظرة عامة على أداء الفرص البيعية"} />

      {isAdmin && (
        <Card>
          <div className="op-card-title">عرض لوحة بائع معيّن</div>
          <div style={{display:"flex", gap:8}}>
            <div style={{flex:1}}><Select value={viewAsSeller||""} onChange={onSelectSeller} options={config.sellers} placeholder="كل البائعين (الإجمالي)" /></div>
            {viewAsSeller && <button className="op-btn-secondary" onClick={()=>onSelectSeller(null)}>الإجمالي</button>}
          </div>
        </Card>
      )}

      <Card className="op-funnel-card">
        <div className="op-funnel-title">مسار الفرص</div>
        <div className="op-funnel">
          {[["إجمالي الزيارات", total, 100, "#8590a6"], [STATUS_META.closed.label, closed, total?closed/total*100:0, STATUS_META.closed.color],
            [STATUS_META.open.label, open, total?open/total*100:0, STATUS_META.open.color], [STATUS_META.lost.label, lost, total?lost/total*100:0, STATUS_META.lost.color]]
            .map(([label,value,pct,color]) => (
            <div className="op-funnel-seg" key={label}>
              <div className="op-funnel-row"><span className="op-funnel-label">{label}</span><span className="op-funnel-num" style={{color}}>{value}</span></div>
              <div className="op-funnel-bar-track"><div className="op-funnel-bar" style={{ width: `${Math.max(pct,3)}%`, background: color }} /></div>
            </div>
          ))}
        </div>
      </Card>

      <div className="op-kpi-row">
        <Card className="op-kpi"><div className="op-kpi-icon" style={{background:"#0F1B2D1a",color:"#0F1B2D"}}><Icon name="users" size={17}/></div><div><div className="op-kpi-value">{total}</div><div className="op-kpi-label">إجمالي العملاء</div></div></Card>
        <Card className="op-kpi"><div className="op-kpi-icon" style={{background:"#2F7A561a",color:"#2F7A56"}}><Icon name="trendUp" size={17}/></div><div><div className="op-kpi-value">{conversion}%</div><div className="op-kpi-label">معدل التحويل</div></div></Card>
        <Card className="op-kpi"><div className="op-kpi-icon" style={{background:"#0F1B2D1a",color:"#0F1B2D"}}><Icon name="coins" size={17}/></div><div><div className="op-kpi-value">{totalValue.toLocaleString("ar-EG")}</div><div className="op-kpi-label">قيمة المبيعات</div></div></Card>
        <Card className="op-kpi"><div className="op-kpi-icon" style={{background: dueFollowUps.length?"#B23A2E1a":"#2F7A561a", color: dueFollowUps.length?"#B23A2E":"#2F7A56"}}><Icon name="alert" size={17}/></div><div><div className="op-kpi-value">{dueFollowUps.length}</div><div className="op-kpi-label">متابعات مستحقة</div></div></Card>
      </div>

      <Card><div className="op-card-title">توزيع حالات العملاء</div>{total ? <Donut data={pieData} total={total} /> : <EmptyHint text="لا توجد بيانات بعد" />}</Card>

      <Card><div className="op-card-title">أسباب حالة فاقد</div>{lostReasonData.length ? <HBarList data={lostReasonData} color={STATUS_META.lost.color} /> : <EmptyHint text="لا توجد بيانات بعد" />}</Card>
      <Card><div className="op-card-title">أسباب حالة مفتوح</div>{openReasonData.length ? <HBarList data={openReasonData} color={STATUS_META.open.color} /> : <EmptyHint text="لا توجد بيانات بعد" />}</Card>

      <Card>
        <div className="op-card-title">متابعات مستحقة الآن</div>
        {dueFollowUps.length ? (
          <div className="op-due-list">
            {dueFollowUps.map((r,i) => (
              <div className="op-due-row" key={i} onClick={() => { setEditingId(r.c.id); setView("entry"); }}>
                <div><div className="op-due-name">{r.c.name||"بدون اسم"}</div><div className="op-due-meta">{r.c.phone} · {r.c.seller}</div></div>
                <div className={`op-due-badge ${r.diff<0?"late":""}`}>{r.diff<0?`متأخر ${Math.abs(r.diff)} يوم`:r.diff===0?"اليوم":"غدًا"}</div>
              </div>
            ))}
          </div>
        ) : <EmptyHint text="لا توجد متابعات مستحقة" />}
      </Card>

      {isAdmin && !viewAsSeller && (
        <Card>
          <div className="op-card-title">أداء البائعين</div>
          {sellerStats.length ? sellerStats.map((s) => (
            <div className="op-seller-card" key={s.seller}>
              <div className="op-seller-top"><span>{s.seller}</span><span>{s.closed}/{s.total}</span></div>
              <div className="op-rate-bar-wrap"><div className="op-rate-bar" style={{width:`${s.rate}%`}} /><span>{s.rate}%</span></div>
            </div>
          )) : <EmptyHint text="لا توجد بيانات بعد" />}
        </Card>
      )}
    </div>
  );
}

/* ---------------- Entry Form ---------------- */

      <Card>
        <div className="op-section-title">بيانات العميل</div>

          {lockSeller
            ? <input className="op-input" value={form.seller} disabled style={{background:"#F1EEE4", color:"#556"}} />
            : <Select value={form.seller} onChange={(v)=>set("seller",v)} options={config.sellers} placeholder="اختر البائع" />}
        </Field>
        <Field label="المنتج"><input className="op-input" value={form.product} onChange={(e)=>set("product",e.target.value)} placeholder="اسم المنتج" /></Field>

      </Card>

      <Card>
        <div className="op-section-title">حالة العميل</div>
        <div className="op-status-tabs">

            <button key={key} className="op-status-tab" style={form.status===key?{borderColor:m.color,color:m.color,background:m.bg}:{}} onClick={()=>set("status",key)}>{m.label}</button>

          <div style={{marginTop:14}}>
            <Field label="سبب استمرار الحالة كمفتوحة"><Select value={form.openReason} onChange={(v)=>set("openReason",v)} options={config.openReasons} placeholder="اختر السبب" /></Field>
            <FollowUpBlock label="المتابعة الأولى (48 ساعة من الزيارة)" date={preview.f1Date} method={form.f1Method} done={form.f1Done} onMethod={(v)=>set("f1Method",v)} onDone={(v)=>set("f1Done",v)} options={config.commMethods} />
            <FollowUpBlock label="المتابعة الثانية (10 أيام من الزيارة)" date={preview.f2Date} method={form.f2Method} done={form.f2Done} onMethod={(v)=>set("f2Method",v)} onDone={(v)=>set("f2Done",v)} options={config.commMethods} />
            <Field label="المتابعة الثالثة (اختياري - تاريخ يدوي)"><input type="date" className="op-input" value={form.f3Date} onChange={(e)=>set("f3Date",e.target.value)} /></Field>
          </div>
        )}
        {form.status === "lost" && (
          <div style={{marginTop:14}}>
            <Field label="سبب حالة الفاقد"><Select value={form.lostReason} onChange={(v)=>set("lostReason",v)} options={config.lostReasons} placeholder="اختر السبب" /></Field>
          </div>
        )}
        {form.status === "closed" && (
          <div style={{marginTop:14}}>
            <Field label="تاريخ الاستلام" required><input type="date" className="op-input" value={form.receiptDate} onChange={(e)=>set("receiptDate",e.target.value)} /></Field>
            <FollowUpBlock label="المتابعة الأولى (48 ساعة من الاستلام)" date={preview.f1Date} method={form.f1Method} done={form.f1Done} onMethod={(v)=>set("f1Method",v)} onDone={(v)=>set("f1Done",v)} options={config.commMethods} />
            <FollowUpBlock label="المتابعة الثانية (7 أيام من الاستلام)" date={preview.f2Date} method={form.f2Method} done={form.f2Done} onMethod={(v)=>set("f2Method",v)} onDone={(v)=>set("f2Done",v)} options={config.commMethods} />
            <FollowUpBlock label="المتابعة الثالثة (30 يوم من الاستلام)" date={preview.f3Date} method={form.f3Method} done={form.f3Done} onMethod={(v)=>set("f3Method",v)} onDone={(v)=>set("f3Done",v)} options={config.commMethods} />

      <div className="op-form-actions">

        <button className="op-btn-primary" disabled={!canSubmit} onClick={()=>onSave(form)}><Icon name="save" size={15}/> حفظ</button>
      </div>
    </div>
  );
}
const FollowUpBlock = ({ label, date, method, done, onMethod, onDone, options }) => (
  <div className="op-fu-block">
    <div className="op-fu-top"><span className="op-field-label">{label}</span><span className="op-fu-date">{fmtDate(date)}</span></div>

      <Select value={method} onChange={onMethod} options={options} placeholder="طريقة التواصل" />
      <label className="op-check"><input type="checkbox" checked={done} onChange={(e)=>onDone(e.target.checked)} /><span>تمت</span></label>
    </div>
  </div>
);

/* ---------------- Customers List ---------------- */
function CustomersList({ customers, config, onEdit, onDelete, onNew, showToast }) {
  const [q, setQ] = useState("");
  const [statusFilter, setStatusFilter] = useState("");
  const [confirmId, setConfirmId] = useState(null);

  const filtered = customers.filter((c) => {
    if (statusFilter && getStatusMeta(c.status).label !== statusFilter) return false;
    if (q && !(c.name.includes(q) || c.phone.includes(q))) return false;
    return true;
  });

  const exportExcel = () => {
    if (!filtered.length) return;
    const rows = filtered.map((c) => ({
      "اسم العميل": c.name, "رقم التليفون": c.phone, "تاريخ الزيارة": c.visitDate,
      "الفرع": c.branch, "البائع": c.seller, "المنتج": c.product, "قيمة المنتج": c.productValue,
      "الحالة": getStatusMeta(c.status).label, "سبب مفتوح": c.openReason, "سبب فاقد": c.lostReason,
      "تاريخ الاستلام": c.receiptDate,
      "متابعة 1": c.f1Date, "طريقة متابعة 1": c.f1Method, "تمت متابعة 1": c.f1Done?"نعم":"لا",
      "متابعة 2": c.f2Date, "طريقة متابعة 2": c.f2Method, "تمت متابعة 2": c.f2Done?"نعم":"لا",
      "متابعة 3": c.f3Date, "طريقة متابعة 3": c.f3Method, "تمت متابعة 3": c.f3Done?"نعم":"لا",
    }));
    try {
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "العملاء");
      XLSX.writeFile(wb, `عملاء_${todayStr()}.xlsx`);
    } catch (e) { showToast("تعذر التصدير — تأكد من الاتصال بالإنترنت أول مرة", "error"); }
  };

  return (
    <div className="op-view">
      <ViewHeader title="قائمة العملاء" subtitle={`${filtered.length} من ${customers.length} عميل`}
        action={<div className="op-header-actions">
          <button className="op-btn-secondary" onClick={exportExcel} disabled={!filtered.length}><Icon name="download" size={15}/> Excel</button>
          <button className="op-btn-primary" onClick={onNew}><Icon name="plus" size={15}/> عميل جديد</button>
        </div>} />

      <div className="op-search"><Icon name="search" size={15}/><input placeholder="بحث بالاسم أو التليفون" value={q} onChange={(e)=>setQ(e.target.value)} /></div>
      <div className="op-filters-row"><Select value={statusFilter} onChange={setStatusFilter} options={Object.values(STATUS_META).map(m=>m.label)} placeholder="كل الحالات" /></div>

      {filtered.length ? filtered.map((c) => (
        <div className="op-customer-card" key={c.id}>
          <div className="op-cc-top">
            <div><div className="op-cc-name">{c.name}</div><div className="op-cc-meta">{c.phone} · {c.branch}</div></div>
            <span className="op-badge" style={{color:getStatusMeta(c.status).color, background:getStatusMeta(c.status).bg}}>{getStatusMeta(c.status).label}</span>
          </div>
          <div className="op-cc-bottom">
            <span>{c.product||"—"} {c.productValue ? `· ${Number(c.productValue).toLocaleString("ar-EG")}`:""}</span>
            <div className="op-cc-actions">
              <button onClick={()=>onEdit(c.id)}><Icon name="edit" size={14}/></button>
              {confirmId===c.id ? <button className="op-danger" onClick={()=>{onDelete(c.id); setConfirmId(null);}}><Icon name="check" size={14}/></button>
                : <button onClick={()=>setConfirmId(c.id)}><Icon name="trash" size={14}/></button>}
            </div>
          </div>
        </div>
      )) : <EmptyHint text="لا يوجد عملاء مطابقين" />}
    </div>
  );
}

/* ---------------- Settings ---------------- */
function SettingsView({ config, onSave, showToast }) {
  const [local, setLocal] = useState(config);
  const [dirty, setDirty] = useState(false);
  const lists = [
    { key:"branches", label:"الفروع" }, { key:"sellers", label:"البائعون" },
    { key:"openReasons", label:"أسباب حالة \"مفتوح\"" }, { key:"lostReasons", label:"أسباب حالة \"فاقد\"" },
    { key:"commMethods", label:"طرق التواصل" },
  ];
  const addItem = (key,val) => { if(!val.trim())return; setLocal((l)=>({...l,[key]:[...l[key],val.trim()]})); setDirty(true); };
  const removeItem = (key,idx) => { setLocal((l)=>({...l,[key]:l[key].filter((_,i)=>i!==idx)})); setDirty(true); };

  return (
    <div className="op-view">
      <ViewHeader title="الإعدادات" subtitle="عدّل القوائم المنسدلة — أضف أو احذف أي عنصر"
        action={dirty ? <button className="op-btn-primary" style={{marginTop:8}} onClick={()=>{onSave(local); setDirty(false);}}><Icon name="save" size={15}/> حفظ التغييرات</button> : null} />
      {lists.map((l) => <ListEditor key={l.key} label={l.label} items={local[l.key]} onAdd={(v)=>addItem(l.key,v)} onRemove={(i)=>removeItem(l.key,i)} />)}
    </div>
  );
}
function ListEditor({ label, items, onAdd, onRemove }) {
  const [val, setVal] = useState("");
  return (
    <Card>
      <div className="op-card-title">{label}</div>
      <div className="op-list-add">
        <input className="op-input" value={val} onChange={(e)=>setVal(e.target.value)} placeholder="عنصر جديد..." onKeyDown={(e)=>{if(e.key==="Enter"){onAdd(val); setVal("");}}} />
        <button className="op-btn-icon" onClick={()=>{onAdd(val); setVal("");}}><Icon name="plus" size={16}/></button>
      </div>
      <div className="op-chip-list">
        {items.map((it,i) => <div className="op-chip" key={i}><span>{it}</span><button onClick={()=>onRemove(i)}><Icon name="x" size={11}/></button></div>)}
        {!items.length && <span style={{fontSize:12,color:"#9a9dac"}}>لا توجد عناصر</span>}
      </div>
    </Card>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return (
        <div style={{padding:24, textAlign:"center", direction:"rtl", fontFamily:"Tajawal, sans-serif"}}>
          <h2 style={{color:"#B23A2E"}}>حصل خطأ غير متوقع</h2>
          <p style={{color:"#6b7285", fontSize:13}}>اضغط الزر تحت لإعادة تحميل التطبيق. لو تكرر الخطأ، ابعت وصف لما حصل.</p>
          <button onClick={()=>window.location.reload()} style={{marginTop:12, background:"#0F1B2D", color:"#fff", border:"none", padding:"12px 20px", borderRadius:10, fontFamily:"inherit", fontWeight:700}}>إعادة تحميل</button>
        </div>
      );
    }
    return this.props.children;
  }
}
